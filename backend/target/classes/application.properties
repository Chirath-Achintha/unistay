# Application Configuration
spring.application.name=unistay
server.port=8080

# -------------------------------------------------------
# Database Configuration (Neon PostgreSQL)
# Set the following environment variables before running:
#   DB_URL      - your Neon JDBC connection URL
#   DB_USERNAME - your Neon database username
#   DB_PASSWORD - your Neon database password
# -------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Disable open-in-view to prevent lazy-loading issues and suppress the startup warning
spring.jpa.open-in-view=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Note: spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS was removed in Jackson 3.x (Spring Boot 4.x)

# -------------------------------------------------------
# Admin Panel Configuration
# Set the following environment variables before running:
#   ADMIN_EMAIL    - admin login email address
#   ADMIN_PASSWORD - admin login password (plain text, checked server-side)
# -------------------------------------------------------
spring.admin.email=${ADMIN_EMAIL}
spring.admin.password=${ADMIN_PASSWORD}

# -------------------------------------------------------
# Cloudinary Configuration
# Set the following environment variables:
#   CLOUDINARY_CLOUD_NAME - your Cloudinary cloud name
#   CLOUDINARY_API_KEY    - your Cloudinary API key
#   CLOUDINARY_API_SECRET - your Cloudinary API secret
# -------------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Multipart file upload limits (10MB per file)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
