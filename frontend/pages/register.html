<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account – UniStay</title>
    <meta name="description" content="Create a student or boarding owner account on UniStay platform.">
    
    <!-- Reuse Existing Design System -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body style="background-color: var(--bg-alt);">

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="container">
            <a href="../index.html" class="navbar-brand">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color: var(--primary);">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                </svg>
                Uni<span>Stay</span>
            </a>
            <ul class="navbar-nav">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="../index.html#search-section" class="nav-link">Accommodations</a></li>
            </ul>
        </div>
    </header>

    <!-- Main Registration Section -->
    <main class="container container-sm" style="padding-top: 3rem; padding-bottom: 4rem;">
        <div class="card" style="box-shadow: var(--shadow-lg);">
            <div class="card-header text-center" style="padding: 2rem 1.5rem 1rem 1.5rem; background: var(--bg-surface);">
                <h2>Join UniStay Platform</h2>
                <p class="text-muted" style="font-size: var(--font-size-sm); margin-top: 0.25rem;">
                    Create an account to search for student rooms or manage your properties.
                </p>

                <!-- Role Selector Tabs -->
                <div style="display: flex; gap: 8px; background: var(--bg-alt); padding: 6px; border-radius: var(--radius-md); margin-top: 1.5rem;">
                    <button type="button" class="btn btn-full" id="tab-student" onclick="switchRole('STUDENT')" style="background: var(--primary); color: white;">
                        🎓 Student Registration
                    </button>
                    <button type="button" class="btn btn-full btn-outline" id="tab-owner" onclick="switchRole('OWNER')">
                        🏠 Boarding Owner Registration
                    </button>
                </div>
            </div>

            <div class="card-body" style="padding: 2rem;">
                
                <!-- Feedback Alert Container -->
                <div id="alert-container"></div>

                <!-- STUDENT REGISTRATION FORM -->
                <form id="student-form" class="registration-form" onsubmit="handleStudentSubmit(event)" novalidate>
                    <h4 style="margin-bottom: 1.25rem; color: var(--primary-dark);">Student Profile Information</h4>
                    
                    <div class="form-group">
                        <label for="student-fullname" class="form-label">Full Name *</label>
                        <input type="text" id="student-fullname" class="form-control" placeholder="e.g., Sarah Jenkins" required>
                    </div>

                    <div class="grid grid-2" style="gap: 1rem;">
                        <div class="form-group">
                            <label for="student-email" class="form-label">Email Address *</label>
                            <input type="email" id="student-email" class="form-control" placeholder="student@university.edu" required>
                        </div>
                        <div class="form-group">
                            <label for="student-phone" class="form-label">Phone Number *</label>
                            <input type="tel" id="student-phone" class="form-control" placeholder="+1 555-0192" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="student-password" class="form-label">Password *</label>
                        <input type="password" id="student-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
                    </div>

                    <div class="grid grid-2" style="gap: 1rem;">
                        <div class="form-group">
                            <label for="student-university" class="form-label">University / Campus *</label>
                            <select id="student-university" class="form-select" required>
                                <option value="">Select University</option>
                                <option value="City University of Technology">City University of Technology</option>
                                <option value="National State University">National State University</option>
                                <option value="Metropolitan Institute of Science">Metropolitan Institute of Science</option>
                                <option value="Greenwood College">Greenwood College</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="student-gender" class="form-label">Gender *</label>
                            <select id="student-gender" class="form-select" required>
                                <option value="">Select Gender</option>
                                <option value="Female">Female</option>
                                <option value="Male">Male</option>
                                <option value="Other">Other / Prefer not to say</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 1rem;" id="btn-submit-student">
                        Create Student Account
                    </button>
                </form>

                <!-- BOARDING OWNER REGISTRATION FORM -->
                <form id="owner-form" class="registration-form" onsubmit="handleOwnerSubmit(event)" style="display: none;" novalidate>
                    <h4 style="margin-bottom: 1.25rem; color: var(--secondary);">Boarding Owner Profile Information</h4>

                    <div class="form-group">
                        <label for="owner-fullname" class="form-label">Full Name *</label>
                        <input type="text" id="owner-fullname" class="form-control" placeholder="e.g., Robert Vance" required>
                    </div>

                    <div class="grid grid-2" style="gap: 1rem;">
                        <div class="form-group">
                            <label for="owner-email" class="form-label">Email Address *</label>
                            <input type="email" id="owner-email" class="form-control" placeholder="owner@domain.com" required>
                        </div>
                        <div class="form-group">
                            <label for="owner-phone" class="form-label">Phone Number *</label>
                            <input type="tel" id="owner-phone" class="form-control" placeholder="+1 555-0144" required>
                        </div>
                    </div>

                    <div class="grid grid-2" style="gap: 1rem;">
                        <div class="form-group">
                            <label for="owner-password" class="form-label">Password *</label>
                            <input type="password" id="owner-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label for="owner-nic" class="form-label">NIC / National ID *</label>
                            <input type="text" id="owner-nic" class="form-control" placeholder="National ID or Passport No." required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="owner-address" class="form-label">Permanent Address *</label>
                        <textarea id="owner-address" class="form-control" rows="2" placeholder="Street address, City, Postal Code" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-secondary btn-full btn-lg" style="margin-top: 1rem;" id="btn-submit-owner">
                        Create Boarding Owner Account
                    </button>
                </form>

            </div>

            <div class="card-footer text-center" style="font-size: var(--font-size-sm);">
                Already registered? <a href="../index.html" style="font-weight: 600;">Return to Home Page</a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
