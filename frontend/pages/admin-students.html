<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management – Admin – UniStay</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }

        /* Sidebar (Duplicate from dashboard for simplicity, normally would use a component or template) */
        .sidebar { background-color: var(--primary-dark); color: white; padding: var(--space-xl) var(--space-md); display: flex; flex-direction: column; }
        .sidebar-brand { display: flex; align-items: center; gap: var(--space-sm); font-size: var(--font-size-xl); font-weight: 800; color: white; margin-bottom: var(--space-2xl); padding-left: var(--space-sm); }
        .sidebar-brand span { color: #7dd3fc; }
        .nav-menu { list-style: none; flex: 1; }
        .nav-menu li { margin-bottom: var(--space-sm); }
        .nav-menu a { display: flex; align-items: center; gap: var(--space-sm); color: #cbd5e1; text-decoration: none; padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); transition: all var(--transition-fast); font-weight: 500; }
        .nav-menu a:hover, .nav-menu a.active { background-color: rgba(255,255,255,0.1); color: white; }
        .sidebar-footer { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1); padding-top: var(--space-md); font-size: var(--font-size-sm); color: #94a3b8; }
        
        .main-content { background-color: var(--bg-alt); padding: var(--space-xl); overflow-y: auto; }
        
        .page-header { margin-bottom: var(--space-lg); display: flex; justify-content: space-between; align-items: flex-end; }
        
        .search-bar { display: flex; gap: var(--space-sm); width: 100%; max-width: 400px; }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-card {
            background: white; border-radius: var(--radius-lg); width: 100%; max-width: 500px;
            box-shadow: var(--shadow-xl); overflow: hidden;
            transform: scale(0.95); transition: transform var(--transition-fast);
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        
        .modal-header { padding: var(--space-md) var(--space-lg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: var(--font-size-lg); }
        .btn-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        
        .modal-body { padding: var(--space-lg); }
        .modal-footer { padding: var(--space-md) var(--space-lg); border-top: 1px solid var(--border-color); background: var(--bg-alt); display: flex; justify-content: flex-end; gap: var(--space-sm); }
        
        /* View specific details */
        .detail-row { display: grid; grid-template-columns: 120px 1fr; margin-bottom: var(--space-sm); padding-bottom: var(--space-sm); border-bottom: 1px solid var(--border-color); }
        .detail-row:last-child { border: none; margin: 0; padding: 0; }
        .detail-label { color: var(--text-muted); font-size: var(--font-size-sm); font-weight: 600; }
        .detail-value { color: var(--text-main); font-size: var(--font-size-sm); }
    </style>
</head>
<body>
    <script src="../js/admin.js"></script>
    <script>checkAdminAuth();</script>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                Uni<span>Stay</span>
            </div>
            <ul class="nav-menu">
                <li><a href="admin-dashboard.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a></li>
                <li><a href="admin-students.html" class="active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Student Management
                </a></li>
            </ul>
            <div class="sidebar-footer">
                <button onclick="logout()" class="btn btn-outline btn-sm" style="color: white; border-color: rgba(255,255,255,0.3); width: 100%;">Log Out</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>Student Management</h1>
                    <p class="text-muted">Manage all registered student accounts on the platform.</p>
                </div>
                
                <form class="search-bar" id="search-form" onsubmit="handleSearch(event)">
                    <input type="text" id="search-input" class="form-control" placeholder="Search name or email...">
                    <button type="submit" class="btn btn-primary">Search</button>
                    <button type="button" class="btn btn-outline" onclick="loadStudents()">Clear</button>
                </form>
            </div>

            <div id="alert-container"></div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table" id="students-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>University</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="students-tbody">
                            <tr><td colspan="5" class="text-center">Loading students...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- VIEW MODAL -->
    <div class="modal-overlay" id="view-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Student Profile</h3>
                <button class="btn-close" onclick="closeModal('view-modal')">&times;</button>
            </div>
            <div class="modal-body" id="view-details">
                <!-- Populated via JS -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="closeModal('view-modal')">Close</button>
            </div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Edit Student</h3>
                <button class="btn-close" onclick="closeModal('edit-modal')">&times;</button>
            </div>
            <form id="edit-form" onsubmit="handleEditSubmit(event)">
                <div class="modal-body">
                    <input type="hidden" id="edit-id">
                    
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="edit-fullname" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" id="edit-phone" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">University</label>
                        <select id="edit-university" class="form-select" required>
                            <option value="City University of Technology">City University of Technology</option>
                            <option value="National State University">National State University</option>
                            <option value="Metropolitan Institute of Science">Metropolitan Institute of Science</option>
                            <option value="Greenwood College">Greenwood College</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Gender</label>
                        <select id="edit-gender" class="form-select" required>
                            <option value="Female">Female</option>
                            <option value="Male">Male</option>
                            <option value="Other">Other / Prefer not to say</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeModal('edit-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/admin-students.js"></script>
</body>
</html>
