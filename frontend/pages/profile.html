<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile – UniStay</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    
    <style>
        .profile-container {
            max-width: 680px;
            margin: 4rem auto;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-md);
        }
        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        .profile-avatar {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 auto 1rem;
            box-shadow: 0 4px 24px rgba(99,102,241,0.25);
        }
        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }
        .profile-role-badge {
            display: inline-block;
            font-size: 0.75rem;
            color: var(--primary);
            background: var(--primary-light);
            border-radius: 99px;
            padding: 0.2rem 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .profile-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-top: 1.25rem;
        }
        .profile-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem 2rem;
        }
        @media (max-width: 480px) {
            .profile-details { grid-template-columns: 1fr; }
        }
        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .detail-label {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .detail-value {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 500;
        }
        .loading-state, .error-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        .error-state { color: var(--danger-color); }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
            animation: modal-in 0.2s ease;
        }
        @keyframes modal-in {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }
        .modal-footer {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }
        .alert-banner {
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }
        .alert-banner.success { background: #d1fae5; color: #065f46; }
        .alert-banner.error   { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body style="background-color: var(--bg-alt); min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navbar -->
    <header class="navbar" id="top">
        <div class="container">
            <a href="../index.html" class="navbar-brand">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span class="brand-name">Uni<span>Stay</span></span>
            </a>
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">&#9776;</button>
            <ul class="navbar-nav" id="main-nav">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="search.html" class="nav-link">Find Boardings</a></li>
            </ul>
            <div class="navbar-actions">
                <a href="login.html" class="btn btn-outline btn-sm" id="btn-login">Login</a>
                <a href="register.html" class="btn btn-primary btn-sm" id="btn-register">Register</a>
                <button class="btn btn-secondary btn-sm" id="btn-logout" style="display: none;" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </header>

    <!-- Content -->
    <main class="container" style="flex: 1;">
        <div class="profile-container">
            <div id="loading" class="loading-state">Loading profile details...</div>
            <div id="error" class="error-state" style="display: none;"></div>
            
            <!-- Personal profile page for the logged-in student. -->
            <div id="profile-content" style="display: none;">
                <div class="profile-header">
                    <div class="profile-avatar" id="avatar-initial">U</div>
                    <div class="profile-name" id="display-name">Loading...</div>
                    <span class="profile-role-badge">Student</span>
                    <div class="profile-actions">
                        <button class="btn btn-primary btn-sm" onclick="openEditModal()">✏️ Edit Profile</button>
                        <button class="btn btn-outline btn-sm" onclick="openPasswordModal()">🔒 Change Password</button>
                    </div>
                </div>
                
                <div class="profile-details">
                    <div class="detail-item">
                        <span class="detail-label">Full Name</span>
                        <span class="detail-value" id="val-name">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Email Address</span>
                        <span class="detail-value" id="val-email">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Phone Number</span>
                        <span class="detail-value" id="val-phone">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">University</span>
                        <span class="detail-value" id="val-university">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Gender</span>
                        <span class="detail-value" id="val-gender">-</span>
                    </div>
                </div>

                <div style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                    <h3 style="margin-bottom: 1.5rem; text-align: center;">My Visit Requests</h3>
                    <div id="visits-loading" class="loading-state">Loading visits...</div>
                    <div id="visits-error" class="error-state" style="display: none;"></div>
                    <div id="visits-empty" style="display: none; text-align: center; color: var(--text-muted); padding: 1.5rem;">You haven't requested any visits yet.</div>
                    <div id="visits-list" style="display: flex; flex-direction: column; gap: 1rem;">
                        <!-- Visit cards injected here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-box">
            <div class="modal-title">✏️ Edit Profile</div>
            <div id="edit-alert" class="alert-banner"></div>
            <form id="edit-form" onsubmit="submitEditProfile(event)">
                <div class="form-group">
                    <label class="form-label" for="edit-fullName">Full Name</label>
                    <input type="text" id="edit-fullName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="edit-phone">Phone Number</label>
                    <input type="text" id="edit-phone" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="edit-university">University</label>
                    <select id="edit-university" class="form-select" required>
                        <option value="SLIIT">SLIIT</option>
                        <option value="CINEC">CINEC</option>
                        <option value="Horizon">Horizon Campus</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="edit-gender">Gender</label>
                    <select id="edit-gender" class="form-select" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm" id="edit-submit-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal-overlay" id="password-modal">
        <div class="modal-box">
            <div class="modal-title">🔒 Change Password</div>
            <div id="pw-alert" class="alert-banner"></div>
            <form id="password-form" onsubmit="submitChangePassword(event)">
                <div class="form-group">
                    <label class="form-label" for="current-password">Current Password</label>
                    <input type="password" id="current-password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="new-password">New Password</label>
                    <input type="password" id="new-password" class="form-control" minlength="6" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" class="form-control" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="closePasswordModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm" id="pw-submit-btn">Update Password</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script>
        let currentUser = null;

        // Loads the current student's profile and visit requests when the page opens.
        document.addEventListener('DOMContentLoaded', () => {
            updateUserNav();
            loadProfileData();
        });

        function updateUserNav() {
            const userName = sessionStorage.getItem('unistay_user_name');
            const role = sessionStorage.getItem('unistay_user_role');
            
            const btnLogin = document.getElementById('btn-login');
            const btnRegister = document.getElementById('btn-register');
            const btnLogout = document.getElementById('btn-logout');

            if (userName) {
                btnLogin.href = role === 'OWNER' ? 'owner-dashboard.html' : 'profile.html';
                btnLogin.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: text-bottom; margin-right: 4px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> ${userName}`;
                btnRegister.style.display = 'none';
                btnLogout.style.display = 'inline-block';
            } else {
                window.location.href = 'login.html';
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('unistay_user_name');
            sessionStorage.removeItem('unistay_user_role');
            sessionStorage.removeItem('unistay_user_id');
            window.location.href = '../index.html';
        }

        // Gets the logged-in student's details from the backend so the profile is shown correctly.
        async function loadProfileData() {
            const userId = sessionStorage.getItem('unistay_user_id');
            const role = sessionStorage.getItem('unistay_user_role');
            
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('profile-content');
            
            if (!userId) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = 'User ID not found. Please log in again.';
                return;
            }
            if (role !== 'STUDENT') {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = 'This profile page is only for students.';
                return;
            }
            
            try {
                const response = await API.get(`/users/${userId}`);
                loading.style.display = 'none';
                
                if (response.success && response.data) {
                    currentUser = response.data;
                    renderProfile(currentUser);
                    content.style.display = 'block';
                    loadVisits(userId);
                } else {
                    error.style.display = 'block';
                    error.textContent = response.message || 'Failed to load profile data.';
                }
            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = 'Error connecting to the server. Please try again.';
                console.error('Profile fetch error:', err);
            }
        }

        function renderProfile(user) {
            document.getElementById('avatar-initial').textContent = user.fullName ? user.fullName.charAt(0).toUpperCase() : 'S';
            document.getElementById('display-name').textContent = user.fullName || 'Student';
            document.getElementById('val-name').textContent = user.fullName || 'N/A';
            document.getElementById('val-email').textContent = user.email || 'N/A';
            document.getElementById('val-phone').textContent = user.phone || 'N/A';
            document.getElementById('val-university').textContent = user.university || 'N/A';
            document.getElementById('val-gender').textContent = user.gender || 'N/A';
        }

        // ----- Edit Profile Modal -----
        function openEditModal() {
            if (!currentUser) return;
            document.getElementById('edit-fullName').value = currentUser.fullName || '';
            document.getElementById('edit-phone').value = currentUser.phone || '';
            document.getElementById('edit-university').value = currentUser.university || 'SLIIT';
            document.getElementById('edit-gender').value = currentUser.gender || 'Male';
            showAlert('edit-alert', '', '');
            document.getElementById('edit-modal').classList.add('open');
        }
        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('open');
        }

        async function submitEditProfile(e) {
            e.preventDefault();
            const userId = sessionStorage.getItem('unistay_user_id');
            const btn = document.getElementById('edit-submit-btn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const payload = {
                fullName:   document.getElementById('edit-fullName').value.trim(),
                phone:      document.getElementById('edit-phone').value.trim(),
                university: document.getElementById('edit-university').value,
                gender:     document.getElementById('edit-gender').value,
            };

            try {
                const res = await API.put(`/users/${userId}/profile`, payload);
                if (res.success) {
                    currentUser = res.data;
                    renderProfile(currentUser);
                    // Update session name
                    sessionStorage.setItem('unistay_user_name', currentUser.fullName);
                    showAlert('edit-alert', 'success', '✅ Profile updated successfully!');
                    setTimeout(() => closeEditModal(), 1200);
                } else {
                    showAlert('edit-alert', 'error', res.message || 'Failed to update profile.');
                }
            } catch (err) {
                showAlert('edit-alert', 'error', 'Error connecting to server.');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Changes';
            }
        }

        // ----- Change Password Modal -----
        function openPasswordModal() {
            document.getElementById('password-form').reset();
            showAlert('pw-alert', '', '');
            document.getElementById('password-modal').classList.add('open');
        }
        function closePasswordModal() {
            document.getElementById('password-modal').classList.remove('open');
        }

        async function submitChangePassword(e) {
            e.preventDefault();
            const userId = sessionStorage.getItem('unistay_user_id');
            const btn = document.getElementById('pw-submit-btn');

            const current = document.getElementById('current-password').value;
            const newPw   = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (newPw !== confirm) {
                showAlert('pw-alert', 'error', '❌ New passwords do not match.');
                return;
            }
            if (newPw.length < 6) {
                showAlert('pw-alert', 'error', '❌ New password must be at least 6 characters.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const res = await API.put(`/users/${userId}/change-password`, {
                    currentPassword: current,
                    newPassword: newPw,
                });
                if (res.success) {
                    showAlert('pw-alert', 'success', '✅ Password changed successfully!');
                    setTimeout(() => closePasswordModal(), 1400);
                } else {
                    showAlert('pw-alert', 'error', res.message || 'Failed to change password.');
                }
            } catch (err) {
                showAlert('pw-alert', 'error', 'Error connecting to server.');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        }

        function showAlert(id, type, msg) {
            const el = document.getElementById(id);
            el.className = `alert-banner ${type}`;
            el.textContent = msg;
            el.style.display = msg ? 'block' : 'none';
        }

        // Close modal on overlay click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('open');
                }
            });
        });

        async function loadVisits(studentId) {
            const loading = document.getElementById('visits-loading');
            const error = document.getElementById('visits-error');
            const empty = document.getElementById('visits-empty');
            const list = document.getElementById('visits-list');
            
            try {
                const response = await API.get(`/visits/student/${studentId}`);
                loading.style.display = 'none';
                
                if (response.success && response.data) {
                    const visits = response.data;
                    if (visits.length === 0) {
                        empty.style.display = 'block';
                    } else {
                        list.innerHTML = '';
                        visits.forEach(visit => {
                            const card = document.createElement('div');
                            card.style.border = '1px solid var(--border-color)';
                            card.style.borderRadius = 'var(--radius-md)';
                            card.style.padding = '1.5rem';
                            card.style.background = 'var(--bg-alt)';
                            
                            let statusHtml = '';
                            if (visit.status === 'PENDING') {
                                statusHtml = `<span style="color: var(--warning-color); font-weight: 600;">Status: Pending</span>`;
                            } else if (visit.status === 'ACCEPTED') {
                                statusHtml = `<span style="color: var(--success-color); font-weight: 600;">Visit Confirmed &mdash; ${visit.requestedDate}</span>`;
                            } else if (visit.status === 'DECLINED') {
                                statusHtml = `<span style="color: var(--danger-color); font-weight: 600;">Visit Declined</span>`;
                            } else if (visit.status === 'ALTERNATIVE_DATE_PROPOSED') {
                                statusHtml = `
                                    <span style="color: var(--primary-color); font-weight: 600;">Status: Alternative Date Proposed</span><br/>
                                    <strong>New Date:</strong> ${visit.proposedDate}<br/>
                                    <button class="btn btn-primary btn-sm" style="margin-top: 1rem;" onclick="acceptProposedDate(${visit.id})">Accept New Date</button>
                                `;
                            }

                            card.innerHTML = `
                                <div style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main);">
                                    ${visit.boardingName}
                                </div>
                                <div style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">
                                    <strong>Requested Date:</strong> ${visit.requestedDate}
                                </div>
                                <div style="padding-top: 1rem; border-top: 1px dashed var(--border-color);">
                                    ${statusHtml}
                                </div>
                            `;
                            list.appendChild(card);
                        });
                    }
                } else {
                    error.style.display = 'block';
                    error.textContent = response.message || 'Failed to load visits.';
                }
            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = 'Error fetching visits.';
                console.error(err);
            }
        }

        async function acceptProposedDate(visitId) {
            const studentId = sessionStorage.getItem('unistay_user_id');
            try {
                const response = await API.put(`/visits/${visitId}/student/${studentId}/accept-proposed`);
                if (response.success) {
                    alert('Visit confirmed for the new date!');
                    loadVisits(studentId);
                } else {
                    alert(response.message || 'Failed to accept date.');
                }
            } catch (err) {
                alert('Error accepting date.');
                console.error(err);
            }
        }
    </script>
</body>
</html>
