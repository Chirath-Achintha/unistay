<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – UniStay</title>
    <meta name="description" content="UniStay administrator login portal.">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #1e3a6e 50%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-brand {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        .login-brand .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: var(--font-size-2xl);
            font-weight: 800;
            color: white;
            margin-bottom: var(--space-sm);
        }

        .login-brand .brand-logo span { color: #7dd3fc; }

        .login-brand p {
            color: rgba(255,255,255,0.7);
            font-size: var(--font-size-sm);
        }

        .login-card {
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            padding: var(--space-2xl);
        }

        .login-card h2 {
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: var(--space-xs);
        }

        .login-card .subtitle {
            color: var(--text-muted);
            font-size: var(--font-size-sm);
            margin-bottom: var(--space-xl);
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-size: var(--font-size-xs);
            font-weight: 700;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: var(--space-lg);
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            pointer-events: none;
        }

        .input-icon-wrapper .form-control {
            padding-left: 2.5rem;
        }

        .btn-admin-login {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            font-size: var(--font-size-md);
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            border: none;
            width: 100%;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-normal);
            margin-top: var(--space-md);
        }

        .btn-admin-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        .btn-admin-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: var(--space-lg);
            color: rgba(255,255,255,0.7);
            font-size: var(--font-size-sm);
            transition: color var(--transition-fast);
        }

        .back-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="login-wrapper">

        <!-- Brand Header -->
        <div class="login-brand">
            <div class="brand-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                </svg>
                Uni<span>Stay</span>
            </div>
            <p>University Student Accommodation Platform</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="admin-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                Administrator Access
            </div>

            <h2>Admin Login</h2>
            <p class="subtitle">Enter your administrator credentials to continue.</p>

            <!-- Alert Container -->
            <div id="alert-container"></div>

            <form id="login-form" novalidate onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="admin-email" class="form-label">Admin Email</label>
                    <div class="input-icon-wrapper">
                        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                        </svg>
                        <input type="email" id="admin-email" class="form-control"
                               placeholder="admin@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="admin-password" class="form-label">Password</label>
                    <div class="input-icon-wrapper">
                        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="admin-password" class="form-control"
                               placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn-admin-login" id="btn-login">
                    Sign In to Admin Panel
                </button>
            </form>
        </div>

        <a href="../index.html" class="back-link">← Return to UniStay Homepage</a>
    </div>

    <script src="../js/admin.js"></script>
    <script>
        // If already logged in, skip to dashboard
        if (getAdminToken()) {
            window.location.href = './admin-dashboard.html';
        }

        async function handleLogin(event) {
            event.preventDefault();
            const alertBox = document.getElementById('alert-container');
            const btn = document.getElementById('btn-login');
            alertBox.innerHTML = '';

            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;

            if (!email || !password) {
                alertBox.innerHTML = '<div class="alert alert-danger">⚠️ Please enter both email and password.</div>';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in…';

            try {
                const BASE = window.location.origin.includes(':8080') ? '' : 'http://localhost:8080';
                const res = await fetch(`${BASE}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    alertBox.innerHTML = `<div class="alert alert-danger">❌ ${data.message || 'Login failed.'}</div>`;
                    return;
                }

                saveAdminSession(data.data.token, data.data.adminEmail);
                window.location.href = './admin-dashboard.html';

            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">❌ Cannot reach server. Make sure the backend is running on port 8080.</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In to Admin Panel';
            }
        }
    </script>
</body>
</html>
